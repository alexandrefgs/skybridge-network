<header class="border-b border-line bg-surface">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-6">
    <a routerLink="/" class="flex items-center gap-2.5" data-testid="brand">
      <img src="favicon.svg" alt="" class="h-8 w-8">
      <span class="font-display text-xl font-bold tracking-tight">Sky<span class="text-primary">Bridge</span></span>
    </a>

    <nav class="flex items-center gap-2 text-sm">
      @if (auth.currentUser(); as user) {
        <a routerLink="/airports" routerLinkActive="text-primary" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground" data-testid="nav-airports">Airports</a>
        <a routerLink="/aircraft" routerLinkActive="text-primary" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground" data-testid="nav-aircraft">Aircraft</a>
        <a routerLink="/account/security" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground">Security</a>
        <span class="hidden px-2 text-muted sm:inline" data-testid="user-name">{{ user.firstName }} {{ user.lastName }}</span>
        <button type="button" (click)="logout()" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-primary" data-testid="logout">Sign out</button>
      } @else if (!auth.isSignedIn()) {
        <a routerLink="/login" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground">Sign in</a>
        <a routerLink="/register" class="rounded-md bg-primary px-3 py-1.5 font-medium text-primary-foreground transition-colors hover:bg-primary-hover">Create account</a>
      }
      <button
        type="button"
        data-testid="theme-toggle"
        (click)="theme.toggle()"
        class="ml-1 rounded-md border border-line px-3 py-1.5 text-muted transition-colors hover:border-primary hover:text-primary">
        {{ theme.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
      </button>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-10">
  <router-outlet />
</main>
