<header class="border-b border-line bg-surface">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-6">
    <a routerLink="/" class="flex items-center gap-2.5" data-testid="brand">
      <img src="favicon.svg" alt="" class="h-8 w-8">
      <span class="font-display text-xl font-bold tracking-tight">Sky<span class="text-primary">Bridge</span></span>
    </a>

    <nav class="flex items-center gap-2 text-sm">
      <div class="hidden items-center gap-2 lg:flex">
        @if (auth.currentUser(); as user) {
          <sb-nav-dropdown label="About us" testId="nav-about" [items]="aboutItems" />
          <sb-nav-dropdown label="Pilot" testId="nav-pilot" [items]="pilotItems" />
          <a routerLink="/freelance" routerLinkActive="text-primary" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground" data-testid="nav-freelance">Freelance</a>
          <a routerLink="/airlines" routerLinkActive="text-primary" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground" data-testid="nav-airlines">Airlines</a>
          @if (auth.isStaff()) {
            <a routerLink="/admin" routerLinkActive="text-primary" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground" data-testid="nav-admin">Admin</a>
          }
          <sb-user-menu class="ml-2" [user]="user" (signedOut)="logout()" />
        } @else if (!auth.isSignedIn()) {
          <a routerLink="/about" routerLinkActive="text-primary" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground" data-testid="nav-public-about">About</a>
          <a routerLink="/operations" routerLinkActive="text-primary" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground" data-testid="nav-public-operations">Operations</a>
          <a routerLink="/flights" routerLinkActive="text-primary" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground" data-testid="nav-public-flights">Flights</a>
          <a routerLink="/staff" routerLinkActive="text-primary" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground" data-testid="nav-public-staff">Staff</a>
          <a routerLink="/login" class="rounded-md px-3 py-1.5 text-muted transition-colors hover:text-foreground">Sign in</a>
          <a routerLink="/register" class="rounded-md bg-primary px-3 py-1.5 font-medium text-primary-foreground transition-colors hover:bg-primary-hover">Create account</a>
        }
      </div>
      <button
        type="button"
        data-testid="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="theme.theme() === 'dark' ? 'Light mode' : 'Dark mode'"
        class="ml-1 grid h-9 w-9 place-items-center rounded-full border border-line text-muted transition-colors hover:border-primary hover:text-primary">
        @if (theme.theme() === 'dark') {
          <svg data-testid="icon-sun" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        } @else {
          <svg data-testid="icon-moon" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        }
      </button>
      <sb-mobile-menu class="lg:hidden" [aboutItems]="aboutItems" [pilotItems]="pilotItems" (signedOut)="logout()" />
    </nav>
  </div>
</header>

<main class="mx-auto min-h-[60vh] max-w-7xl px-6 py-10">
  <router-outlet />
</main>

<sb-site-footer />
<sb-account-gate />
