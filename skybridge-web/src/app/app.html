<header class="border-b border-line bg-surface">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6">
    <a href="/" class="flex items-center gap-2.5" data-testid="brand">
      <img src="favicon.svg" alt="" class="h-8 w-8">
      <span class="font-display text-xl font-bold tracking-tight">Sky<span class="text-primary">Bridge</span></span>
    </a>
    <button
      type="button"
      data-testid="theme-toggle"
      (click)="theme.toggle()"
      class="rounded-md border border-line px-3 py-1.5 text-sm text-muted transition-colors hover:border-primary hover:text-primary">
      {{ theme.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
    </button>
  </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-10">
  <router-outlet />
</main>
