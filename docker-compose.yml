services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Server=db;Database=SkyBridge;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Database__InitializeOnStartup: "true"
      Seed__ImportAirports: "true"
      Seed__ImportAirlines: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Maps__CartoApiKey: ${CARTO_API_KEY}
      DataProtection__KeysPath: /keys
    volumes:
      - keys:/keys

volumes:
  sqldata:
  keys: