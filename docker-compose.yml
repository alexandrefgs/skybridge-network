services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=db;Database=SkyBridge;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Database__InitializeOnStartup: "true"
      Seed__ImportAirports: "true"
      Seed__ImportAirlines: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Maps__CartoApiKey: ${CARTO_API_KEY}
      DataProtection__KeysPath: /keys
    volumes:
      - keys:/keys

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  backup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/bash
      - -c
      - |
        while true; do
          file="SkyBridge-$$(date +%Y%m%d-%H%M).bak"
          /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b \
            -Q "BACKUP DATABASE [SkyBridge] TO DISK = N'/var/opt/mssql/backup/$$file' WITH INIT" \
            && echo "Backup $$file done"
          find /backups -name 'SkyBridge-*.bak' -mtime +7 -delete
          sleep 86400
        done

volumes:
  sqldata:
  keys:
  caddydata:
  caddyconfig: