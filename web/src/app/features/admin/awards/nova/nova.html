<div class="min-h-screen bg-[var(--sb-bg)]">
  <app-header></app-header>

  <div class="max-w-lg mx-auto px-6 py-10">
    <h1 class="font-display text-2xl font-bold text-white mb-6">{{ modoEdicao ? 'Editar Award' : 'Nova Award' }}</h1>

    @if (erro()) {
      <div class="rounded-lg bg-red-500/10 border border-red-500/30 px-4 py-2 text-sm text-red-300 mb-4">
        {{ erro() }}
      </div>
    }

    @if (carregando()) {
      <div class="text-center py-20 text-slate-500 text-sm">Carregando...</div>
    } @else {
      <div class="rounded-2xl border border-[var(--sb-border)] bg-white/[0.02] p-6 space-y-4">
        <div>
          <label class="text-xs text-slate-400">Nome</label>
          <input [(ngModel)]="nome" placeholder="Ex: Piloto do Mês"
            class="w-full mt-1 bg-black/30 border border-[var(--sb-border)] rounded-lg px-3 py-2 text-sm text-white" />
        </div>

        <div>
          <label class="text-xs text-slate-400">Descrição</label>
          <textarea [(ngModel)]="descricao" rows="3" placeholder="Descrição opcional..."
            class="w-full mt-1 bg-black/30 border border-[var(--sb-border)] rounded-lg px-3 py-2 text-sm text-white"></textarea>
        </div>

        <div>
          <label class="text-xs text-slate-400">Imagem</label>
          <input type="file" accept="image/png,image/jpeg,image/webp" (change)="aoSelecionarFoto($event)"
            class="w-full mt-1 text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-cyan-500 file:text-black hover:file:bg-cyan-400 file:cursor-pointer" />
          @if (fotoPreview() || fotoAtualUrl) {
            <img [src]="fotoPreview() || fotoAtualUrl" class="mt-2 w-16 h-16 rounded-lg object-contain border border-[var(--sb-border)]" />
          }
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-6">
        <button type="button" (click)="cancelar()"
          class="text-sm font-medium text-slate-300 hover:text-white border border-[var(--sb-border)] rounded-lg px-4 py-2 transition-colors">
          Cancelar
        </button>
        <button type="button" (click)="salvar()" [disabled]="!podeSalvar() || salvando()"
          class="text-sm font-medium bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 text-black rounded-lg px-4 py-2 transition-colors">
          {{ salvando() ? 'Salvando...' : (modoEdicao ? 'Salvar Alterações' : 'Criar Award') }}
        </button>
      </div>
    }
  </div>
</div>
